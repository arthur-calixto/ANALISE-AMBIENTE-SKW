services:
  analise-ambiente:
    image: ${APP_IMAGE:?Defina APP_IMAGE}
    container_name: analise-ambiente
    ports:
      - "8590:8590"
    env_file:
      - ${PROD_ENV_FILE:?Defina PROD_ENV_FILE}
    environment:
      SHARED_DIR: /app/data
    volumes:
      - type: bind
        source: ${PROD_DATA_DIR:?Defina PROD_DATA_DIR}
        target: /app/data
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8590/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s
