name: Deploy de produção
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag existente na main (ex.: v1.0.0)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validar versão e selecionar código
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use uma tag vX.Y.Z'; exit 1; }
          commit=$(git rev-parse --verify "refs/tags/$VERSION^{commit}")
          git merge-base --is-ancestor "$commit" origin/main
          git checkout --detach "$commit"
      - name: Definir imagem
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.name }}:${{ inputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Registrar imagem publicada
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: printf 'Imagem publicada %s\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64, analise-producao]
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      APP_IMAGE: ${{ needs.build.outputs.image }}
      PROD_ENV_FILE: ${{ vars.PROD_ENV_FILE }}
      PROD_DATA_DIR: ${{ vars.PROD_DATA_DIR }}
      COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME }}
      DOCKER_CONFIG: ${{ runner.temp }}/docker-auth-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Autenticar no GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Atualizar aplicação
        run: bash scripts/deploy.sh
      - name: Limpar autenticação temporária
        if: always()
        run: rm -rf -- "$DOCKER_CONFIG"
