<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monitor de Consulta</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        .upload-box {
            background: var(--surface); border: 1px dashed var(--border);
            border-radius: var(--radius-lg); padding: 1.5rem; display: flex;
            align-items: center; gap: 1rem; flex-wrap: wrap;
        }
        td.sql { max-width: 480px; overflow-wrap: break-word; color: var(--text-muted); }
        .resumo-stats { display: flex; gap: 0.75rem; margin: 1.25rem 0; flex-wrap: wrap; }
        .stat { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius);
                padding: 0.7rem 1.2rem; }
        .stat .numero { font-family: var(--font-mono); font-size: 1.3rem; font-weight: 700; color: var(--accent); }
        .stat .label { font-size: 0.72rem; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; }
    </style>
</head>
<body>
    <div class="topbar">
        <span class="pulse"></span>
        <span class="marca">ANÁLISE<span class="sub">/monitor</span></span>
        <nav><a href="/">← início</a></nav>
    </div>

    <main class="page">
        <div class="eyebrow">Monitor de consulta</div>
        <h1>Análise de Queries e Processos</h1>
        <div class="meta">Envie o zip exportado pelo monitor de consulta/processos do Sankhya (Monitor_Consulta.log).</div>

        <div class="upload-box">
            <input type="file" id="arquivo" accept=".zip">
            <button id="btn-analisar">Analisar</button>
        </div>

        <div id="resultado"></div>
    </main>

    <script>
        const btn = document.getElementById("btn-analisar");
        const inputArquivo = document.getElementById("arquivo");
        const resultadoDiv = document.getElementById("resultado");

        function renderTabelaQueries(linhas) {
            if (!linhas || linhas.length === 0) return "<p>Nenhum resultado.</p>";
            let html = "<table><thead><tr><th>ID</th><th>Tempo (ms)</th><th>Application</th><th>ResourceID</th><th>SQL</th></tr></thead><tbody>";
            linhas.forEach(row => {
                html += `<tr>
                    <td>${row.ID}</td>
                    <td>${row.TEMPO_MS}</td>
                    <td>${row.APPLICATION}</td>
                    <td>${row.RESOURCE_ID}</td>
                    <td class="sql">${row.SQL}</td>
                </tr>`;
            });
            html += "</tbody></table>";
            return html;
        }

        function renderContagem(linhas) {
            if (!linhas || linhas.length === 0) return "<p>Nenhum resultado.</p>";
            let html = '<div class="contagem-grid">';
            linhas.forEach(row => {
                html += `
                    <div class="contagem-card">
                        <div class="titulo">${row.TITULO}</div>
                        <div class="numero">${row.CONTAGEM}</div>
                        <div class="detalhe">${row.DETALHE}</div>
                    </div>`;
            });
            html += "</div>";
            return html;
        }

        btn.addEventListener("click", async () => {
            if (!inputArquivo.files.length) {
                resultadoDiv.innerHTML = '<p class="erro">Selecione o arquivo .zip primeiro.</p>';
                return;
            }

            btn.disabled = true;
            btn.textContent = "Analisando...";
            resultadoDiv.innerHTML = "";

            const formData = new FormData();
            formData.append("arquivo", inputArquivo.files[0]);

            try {
                const resp = await fetch("/monitor/analisar", { method: "POST", body: formData });
                const data = await resp.json();

                if (data.erro) {
                    resultadoDiv.innerHTML = `<p class="erro">${data.erro}</p>`;
                } else {
                    resultadoDiv.innerHTML = `
                        <div class="resumo-stats">
                            <div class="stat"><div class="numero">${data.total_registros}</div><div class="label">Queries analisadas</div></div>
                            <div class="stat"><div class="numero">${data.tempo_total_ms}</div><div class="label">Tempo total (ms)</div></div>
                        </div>
                        <section><h2>Top Queries Mais Lentas</h2>${renderTabelaQueries(data.top_queries)}</section>
                        <section><h2>Top Processos (Application / ResourceID)</h2>${renderContagem(data.top_processos)}</section>
                    `;
                }
            } catch (e) {
                resultadoDiv.innerHTML = `<p class="erro">Falha ao analisar: ${e}</p>`;
            } finally {
                btn.disabled = false;
                btn.textContent = "Analisar";
            }
        });
    </script>
</body>
</html>
