<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Análise de Ambiente — {{ cliente_id }}</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="topbar">
        <span class="pulse"></span>
        <span class="marca">ANÁLISE<span class="sub">/ambiente</span></span>
        <nav><a href="/">← início</a></nav>
    </div>

    <main class="page">
        <div class="eyebrow">Análise geral do ambiente</div>
        <h1>{{ cliente_id }}</h1>
        <div class="meta">Banco: <strong>{{ db_type }}</strong></div>

        <button id="btn-executar">Executar Análise</button>
        <button id="btn-pdf" class="btn-secundario" style="display:none;">Baixar Relatório PDF</button>
        <div id="resumo"></div>
        <div id="resultado"></div>
    </main>

    <script>
        const sessionId = "{{ session_id }}";
        const checks = {{ checks | tojson }};
        const btn = document.getElementById("btn-executar");
        const btnPdf = document.getElementById("btn-pdf");
        const resumoDiv = document.getElementById("resumo");
        const resultadoDiv = document.getElementById("resultado");
        let ultimoResultado = null;

        function renderTabela(linhas) {
            if (!linhas || linhas.length === 0) return "<p>Nenhum resultado.</p>";
            const temStatus = "STATUS" in linhas[0];
            const colunas = Object.keys(linhas[0]).filter(c => c !== "STATUS");
            let html = "<table><thead><tr>";
            colunas.forEach(c => html += `<th>${c}</th>`);
            html += "</tr></thead><tbody>";
            linhas.forEach(row => {
                const classe = temStatus && String(row.STATUS).toLowerCase() === "alerta" ? ' class="alerta"' : "";
                html += `<tr${classe}>` + colunas.map(c => `<td>${row[c] ?? ""}</td>`).join("") + "</tr>";
            });
            html += "</tbody></table>";
            return html;
        }

        function renderCards(linhas) {
            if (!linhas || linhas.length === 0) return "<p>Nenhum resultado.</p>";
            let html = '<div class="cards-grid">';
            linhas.forEach(row => {
                const status = (row.STATUS || "indefinido").toLowerCase();
                const esperado = row.ESPERADO ?? "";
                const atual = row.ATUAL ?? "";
                html += `
                    <div class="card ${status}">
                        <div class="titulo">${row.PARAMETRO ?? ""}</div>
                        <div class="linha"><span>Esperado</span><span class="valor">${esperado}</span></div>
                        <div class="linha"><span>Atual</span><span class="valor">${atual}</span></div>
                    </div>`;
            });
            html += "</div>";
            return html;
        }

        function renderContagem(linhas) {
            if (!linhas || linhas.length === 0) return "<p>Nenhum resultado.</p>";
            let html = '<div class="contagem-grid">';
            linhas.forEach(row => {
                const status = String(row.STATUS || "").toLowerCase() === "alerta" ? "alerta" : "";
                html += `
                    <div class="contagem-card ${status}">
                        <div class="titulo">${row.TITULO ?? ""}</div>
                        <div class="numero">${row.CONTAGEM ?? ""}</div>
                        <div class="detalhe">${row.DETALHE ?? ""}</div>
                    </div>`;
            });
            html += "</div>";
            return html;
        }

        function contarStatus(data) {
            const contagem = { ok: 0, alerta: 0, indefinido: 0 };
            checks.forEach(check => {
                const linhas = data[check.id];
                if (!linhas) return;
                linhas.forEach(row => {
                    if (!("STATUS" in row)) return;
                    const s = String(row.STATUS || "").toLowerCase();
                    if (contagem[s] !== undefined) contagem[s]++;
                });
            });
            return contagem;
        }

        function renderResumo(contagem) {
            return `
                <div class="resumo-alertas">
                    <div class="resumo-chip"><span class="ponto alerta"></span><span class="num">${contagem.alerta}</span> em alerta</div>
                    <div class="resumo-chip"><span class="ponto indefinido"></span><span class="num">${contagem.indefinido}</span> sem baseline</div>
                    <div class="resumo-chip"><span class="ponto ok"></span><span class="num">${contagem.ok}</span> ok</div>
                </div>`;
        }

        btn.addEventListener("click", async () => {
            btn.disabled = true;
            btn.textContent = "Executando...";
            resumoDiv.innerHTML = "";
            resultadoDiv.innerHTML = "";

            try {
                const resp = await fetch(`/analise/${sessionId}/executar`, { method: "POST" });
                const data = await resp.json();

                resumoDiv.innerHTML = renderResumo(contarStatus(data));
                ultimoResultado = data;
                btnPdf.style.display = "inline-block";

                checks.forEach(check => {
                    const erro = data[`${check.id}_erro`];
                    let corpo;
                    if (erro) {
                        corpo = `<p class="erro">Erro: ${erro}</p>`;
                    } else if (check.exibicao === "cards") {
                        corpo = renderCards(data[check.id]);
                    } else if (check.exibicao === "contagem") {
                        corpo = renderContagem(data[check.id]);
                    } else {
                        corpo = renderTabela(data[check.id]);
                    }
                    resultadoDiv.innerHTML += `<section><h2>${check.titulo}</h2>${corpo}</section>`;
                });
            } catch (e) {
                resultadoDiv.innerHTML = `<p class="erro">Falha ao executar análise: ${e}</p>`;
            } finally {
                btn.disabled = false;
                btn.textContent = "Executar Análise";
            }
        });

        btnPdf.addEventListener("click", async () => {
            if (!ultimoResultado) return;
            btnPdf.disabled = true;
            btnPdf.textContent = "Gerando PDF...";
            try {
                const resp = await fetch(`/analise/${sessionId}/relatorio`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(ultimoResultado),
                });
                if (!resp.ok) throw new Error("Falha ao gerar PDF");
                const blob = await resp.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `analise-ambiente-${sessionId}.pdf`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);
            } catch (e) {
                alert("Erro ao gerar PDF: " + e);
            } finally {
                btnPdf.disabled = false;
                btnPdf.textContent = "Baixar Relatório PDF";
            }
        });
    </script>
</body>
</html>
