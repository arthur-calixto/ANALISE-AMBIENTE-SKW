services:
  analise-ambiente:
    build: .
    container_name: analise-ambiente
    ports:
      - "8000:8000"
    volumes:
      # Diretório compartilhado onde o server-tool.sh grava as sessões
      # (credentials.json por session_id). Ajustar o lado esquerdo
      # pro caminho real no host.
      - /repositorio-compartilhado:/app/data:ro
    env_file:
      - .env
    environment:
      # Força o caminho de dentro do container, independente do que
      # estiver no .env do host (que normalmente aponta pra ./data,
      # usado quando roda fora do Docker).
      - SHARED_DIR=/app/data
    restart: unless-stopped